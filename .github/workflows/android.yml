name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем стабильный Flutter SDK в системе
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем Python 3.12 (Идеальная версия для Flet 1.0 и библиотек)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем критические библиотеки Linux для проверки Flutter Doctor
      - name: Install Linux GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      # 6. Устанавливаем зависимости из вашего pyproject.toml
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pandas openpyxl pycryptodome reportlab

      # 7. Принимаем лицензии и докачиваем платформы Android 34 и инструменты сборки
      - name: Install Missing Android SDK Components & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 8. Запускаем сборку — теперь Flet принудительно возьмет стабильный Python 3.12 для APK
      - name: Build Android APK
        run: |
          flet build apk --yes --python-version 3.12

      # 9. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: build/apk/*.apk
