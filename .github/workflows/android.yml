name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl
          pip install --upgrade pip
          pip install buildozer cython

      # Улучшенный шаг автопринятия лицензий Google
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Принудительно создаем структуру папок и подписываем лицензии
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses/
          echo -e "\n893a5cd8b1afb35c5159347815134391481119d2\n24333f1a61b68a4115227a53a209e380fe91e2e4\nd56f5187479451e99b22f026a27e530c58527a75" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8ecf" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses || true

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
