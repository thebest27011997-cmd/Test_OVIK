name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 для Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем базовые зависимости (Сюда добавлен жизненно важный для pandas модуль numpy)
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pandas openpyxl cryptography reportlab flet

      # 6. НА ТИВНЫЙ МОНТАЖ ЧЕРЕЗ GOOGLE FLUTTER: Сборка с жестким вшиванием библиотек аналитики в APK
      - name: Bootstrap Native Flutter Project
        run: |
          # Создаем пустой классический Flutter проект силами самого Google SDK
          flutter create --org org.ovik --project-name test_ov_app flutter_project
          cd flutter_project
          
          # Нативно подключаем официальный плагин serious_python прямо из реестра Flutter
          flutter pub add serious_python
          
          # Полностью перезаписываем lib/main.dart кристально чистым стартером
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run();
          }
          EOF
          
          # Создаем внутреннюю структуру папок программы
          mkdir -p app
          cp ../main.py app/main.py
          cp ../screens.py app/
          cp ../data_manager.py app/
          cp ../config.py app/
          
          # Зашиваем ассеты (вопросы .dat и шрифты) напрямую внутрь контейнера
          mkdir -p app/assets
          cp -r ../assets/* app/assets/
          
          # ЖЕСТКАЯ МОБИЛЬНАЯ ИНТЕГРАЦИЯ: Принудительно скачиваем чистые мобильные версии 
          # pandas, numpy и cryptography прямо в тело папки приложения перед упаковкой zip!
          pip install --target=app/ numpy pandas openpyxl cryptography reportlab
          
          # Упаковываем весь код и вшитые библиотеки в единый app-package.zip
          cd app
          zip -r ../app-package.zip ./*
          cd ..
          
          # Дублируем архив в подпапку assets для 100% прохождения валидации Flutter
          mkdir -p assets
          cp app-package.zip assets/
          
          # Полностью перезаписываем pubspec.yaml эталонной разметкой под новый плагин
          cat << 'EOF' > pubspec.yaml
          name: test_ov_app
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            serious_python: ^4.7.0
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
            assets:
              - app-package.zip
              - assets/app-package.zip
          EOF
          
          # Автоматически принимаем все системные лицензии Android Google
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Вычисляем путь к папке библиотек сервера и передаем её плагину serious_python
          PYTHON_SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages())")
          export SERIOUS_PYTHON_SITE_PACKAGES="$PYTHON_SITE_PACKAGES"
          
          # Изолируем сборку в один поток во избежание зависаний
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=false"
          
          # Запускаем прямую нативную компиляцию APK
          flutter build apk --release

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: flutter_project/build/app/outputs/flutter-apk/app-release.apk
