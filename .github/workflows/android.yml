name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем зависимости на сервер сборки
      - name: Install Python & Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build
          python3 -m pip install --upgrade pip
          python3 -m pip install flet pandas openpyxl cryptography reportlab pyinstaller

      # 6. Принимаем лицензии Android
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 7. НА ТИВНЫЙ МОНТАЖ ПРИЛОЖЕНИЯ: Сборка в изолированном каталоге с принудительной очисткой кэша Gradle
      - name: Bootstrap Native Flutter Project and Inject Python Code
        run: |
          # Создаем чистый эталонный проект Flet
          flet create tmp_app
          
          # Копируем файлы в КОРЕНЬ проекта
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          # На всякий случай дублируем файлы в папку SRC
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          # ГЕНЕРИРУЕМ PYPROJECT.TOML СТРОГО В КОРНЕ ПАПКИ СБОРКИ ДЛЯ ИНКЛЮДА ПАКЕТОВ
          cat << 'EOF' > tmp_app/pyproject.toml
          [project]
          name = "test-ovik-app"
          version = "1.0.0"
          dependencies = [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
          ]
          EOF
          
          # Прописываем Requirements.txt во все рабочие папки
          cat << 'EOF' > tmp_app/requirements.txt
          pandas
          openpyxl
          cryptography
          reportlab
          EOF
          cp tmp_app/requirements.txt tmp_app/src/requirements.txt
          
          # Копируем зашифрованные вопросы .dat и шрифты во все структуры ассетов
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          # Перезаписываем внутренний config.json во всех каталогах для подстраховки метаданных Flutter
          cat << 'EOF' > tmp_app/config.json
          {
            "project_name": "Тест_ОВ",
            "org_domain": "org.ovik.testapp",
            "dependencies": [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
            ]
          }
          EOF
          cp tmp_app/config.json tmp_app/src/config.json
          
          # Переходим в папку проекта
          cd tmp_app
          
          # ИСПРАВЛЕНИЕ: Тотальная очистка кэша Flutter и Gradle перед сборкой для исключения конфликтов потоков
          flutter clean
          
          # Отключаем десктопные платформы во Flutter
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-macos-desktop
          
          # Запускаем сборку. Добавляем флаг --no-daemon через системные переменные Gradle, 
          # чтобы процессы не блокировали файлы fileHashes.bin в памяти сервера
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          flet build apk --yes

      # 8. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: tmp_app/build/apk/*.apk
