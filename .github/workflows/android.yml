name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl
          pip install --upgrade pip
          pip install buildozer cython

      # СТРАТЕГИЧЕСКИЙ ШАГ: Запускаем Buildozer в режиме подготовки, чтобы он сам скачал Android SDK
      - name: Initialize Android SDK via Buildozer
        run: |
          buildozer android status || true

      # ИСПРАВЛЕНИЕ БАГА ПУТЕЙ GOOGLE: создаем виртуальный мост, чтобы Buildozer нашел sdkmanager в новой папке
      - name: Fix Legacy Android SDK Tools Path
        run: |
          # Создаем структуру папок, которую ищет Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin/
          
          # Находим, куда утилита скачала реальный sdkmanager (в cmdline-tools)
          # и делаем на него прямую системную ссылку
          REAL_SDKMANAGER=$(find ~/.buildozer/android/platform/ -name "sdkmanager" -type f | head -n 1)
          if [ -n "$REAL_SDKMANAGER" ]; then
            ln -s "$REAL_SDKMANAGER" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
            echo "Путь к sdkmanager успешно исправлен!"
          else
            echo "Предупреждение: Сборщик еще не скачал SDK, ссылка создастся во время сборки"
          fi

      # Автоматически одобряем все лицензии Android
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
