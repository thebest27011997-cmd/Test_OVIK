name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код проекта
      - uses: actions/checkout@v4

      # 2. Устанавливаем стабильное окружение Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Устанавливаем зависимости из вашего pyproject.toml
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pandas openpyxl pycryptodome reportlab

      # 5. Запускаем нативную сборку Flet с автоподтверждением
      - name: Build Android APK
        run: |
          flet build apk --yes

      # 6. Выгружаем готовый .apk в артефакты репозитория
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Test-OVIK-Android-App
          path: build/apk/*.apk
