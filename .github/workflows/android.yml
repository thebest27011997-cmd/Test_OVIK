name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем базовые системные утилиты сборки Linux
      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl
          python -m pip install --upgrade pip
          pip install buildozer

      # ГАРАНТИРОВАННОЕ РЕШЕНИЕ: Скачиваем официальный портативный пакет cmdline-tools от Google
      # и собираем структуру, которую Buildozer примет за свою «родную»
      - name: Download and Setup Portable Android SDK
        run: |
          # 1. Создаем правильную структуру папок в домашней директории пользователя
          mkdir -p ~/android-sdk/cmdline-tools/
          mkdir -p ~/android-sdk/tools/bin/
          
          # 2. Скачиваем официальный стабильный cmdline-tools от Google
          wget -q https://google.com
          unzip -q commandlinetools-linux-9477386_latest.zip -d ~/android-sdk/cmdline-tools/
          rm commandlinetools-linux-9477386_latest.zip
          
          # 3. Переименовываем внутреннюю папку, как того требуют новые стандарты Google
          mv ~/android-sdk/cmdline-tools/cmdline-tools ~/android-sdk/cmdline-tools/latest
          
          # 4. Создаем виртуальный мост-ссылку для Buildozer в папку tools/bin/
          ln -s ~/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/android-sdk/tools/bin/sdkmanager
          
          # 5. Принудительно одобряем все лицензии Android
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | ~/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          
          # 6. Жестко прописываем путь к этому созданному SDK в файл настроек buildozer.spec
          echo -e "\nandroid.sdk_path = /home/runner/android-sdk" >> buildozer.spec
          echo -e "android.ndk_path = " >> buildozer.spec
          echo "Портативный SDK успешно развернут и интегрирован!"

      # Запускаем сборку — теперь Buildozer найдет sdkmanager в папке /home/runner/android-sdk/tools/bin/sdkmanager
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # Выгружаем готовый .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
