name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем зависимости на сервер сборки
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flet pandas openpyxl cryptography reportlab pyinstaller

      # 6. Принимаем лицензии Android Google
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 7. ГАРАНТИРОВАННЫЙ ОБХОД БАГОВ: Создаем проект и нативно зашиваем библиотеки силами Python
      - name: Manual Bootstrap and Asset Assembly
        run: |
          # Создаем чистый проект Flet
          flet create tmp_app
          
          # Переносим ваш код в папку src шаблона
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          # Копируем зашифрованные базы вопросов .dat и шрифты внутрь папки src/assets
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          # Скачиваем мобильные зависимости напрямую в папку src приложения, 
          # чтобы они гарантированно улетели на телефон БЕЗ СБОЕВ Gradle!
          pip install --target=tmp_app/src/ pandas openpyxl cryptography reportlab
          
          # Перезаписываем внутренний config.json для жесткой фиксации метаданных Flutter
          cat << 'EOF' > tmp_app/config.json
          {
            "project_name": "Тест_ОВ",
            "org_domain": "org.ovik.testapp",
            "dependencies": []
          }
          EOF
          cp tmp_app/config.json tmp_app/src/config.json

      # 8. СБОРКА ЧИСТЫМ FLUTTER: Однопоточный безопасный режим упаковки
      - name: Compile Secure Mobile Package
        run: |
          cd tmp_app
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-macos-desktop
          
          # Запускаем сборку Flet в строго изолированном однопоточном режиме Gradle,
          # но теперь у него нет конфликта sitepackages, так как мы внедрили их напрямую в src/!
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          flet build apk --yes

      # 9. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: tmp_app/build/apk/*.apk
