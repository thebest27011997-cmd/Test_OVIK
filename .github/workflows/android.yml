name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем зависимости и инструменты Android SDK для Linux
      - name: Install Buildozer and Linux Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl android-sdk
          python -m pip install --upgrade pip
          pip install buildozer

      # Одобряем все лицензии Google в системном SDK Linux
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | /usr/bin/sdkmanager --licenses || true

      # КРИТИЧЕСКИЙ ШАГ: Создаем подпапки tools/bin напрямую внутри /usr/lib/android-sdk,
      # чтобы Buildozer гарантированно нашел sdkmanager там, где ожидает!
      - name: Inject System SDK Paths and Structure
        run: |
          # Создаем структуру директорий внутри системного SDK с правами sudo
          sudo mkdir -p /usr/lib/android-sdk/tools/bin/
          
          # Создаем символическую ссылку на реальный sdkmanager
          sudo ln -s /usr/bin/sdkmanager /usr/lib/android-sdk/tools/bin/sdkmanager || true
          
          # На всякий случай дублируем одобрение лицензий через созданный путь
          yes | sudo /usr/lib/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # Прописываем путь к этому системному SDK в файл настроек buildozer.spec
          echo -e "\nandroid.sdk_path = /usr/lib/android-sdk" >> buildozer.spec
          echo -e "android.ndk_path = " >> buildozer.spec
          echo "Структура путей успешно скорректирована!"

      # Запускаем сборку — теперь Buildozer найдет sdkmanager по пути /usr/lib/android-sdk/tools/bin/sdkmanager
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # Выгружаем готовый .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
