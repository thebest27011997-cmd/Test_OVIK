name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем стабильный Flutter SDK в системе
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем критические библиотеки Linux для проверки Flutter Doctor
      - name: Install Linux GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      # 6. Устанавливаем зависимости в глобальное окружение сервера
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pandas openpyxl cryptography reportlab

      # 7. Принимаем лицензии Android
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 8. СТРОГИЙ ПЕРЕНОС И ИНЖЕКТИРОВАНИЕ ЗАВИСИМОСТЕЙ: дублируем файлы в корень и в src
      - name: Bootstrap and Build Native Android Package
        run: |
          # Создаем чистый эталонный проект Flet
          flet create tmp_app
          
          # Копируем файлы в КОРЕНЬ проекта (где их ищет flet build)
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          # На всякий случай дублируем файлы в папку SRC (для совместимости со старыми хуками)
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          # Копируем зашифрованные вопросы .dat и шрифты во все возможные структуры ассетов
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          # ЖЕСТКАЯ КОРРЕКЦИЯ ДЛЯ SERIOUS_PYTHON:
          # Записываем точный список библиотек в pyproject.toml внутри папки сборки
          cat << 'EOF' > tmp_app/pyproject.toml
          [project]
          name = "test-ovik-app"
          version = "1.0.0"
          dependencies = [
              "flet==1.0.0",
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
          ]
          EOF
          
          # Перезаписываем внутренний config.json для метаданных Flutter
          cat << 'EOF' > tmp_app/config.json
          {
            "project_name": "Тест_ОВ",
            "org_domain": "org.ovik.testapp",
            "dependencies": [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
            ]
          }
          EOF
          
          # Переходим в созданный и полностью настроенный проект и запускаем сборку
          cd tmp_app
          flutter config --no-enable-linux-desktop
          
          # Запускаем сборку (flet найдет main.py в корне и подтянет pyproject.toml)
          flet build apk --yes --python-version 3.12

      # 9. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: tmp_app/build/apk/*.apk
