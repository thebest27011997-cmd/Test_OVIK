name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта из репозитория
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем базовые зависимости (включая pyinstaller)
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas openpyxl cryptography reportlab flet pyinstaller

      # 6. Принимаем лицензии Android Google
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 7. НА ТИВНЫЙ МОНТАЖ ЧЕРЕЗ GOOGLE FLUTTER: Чистая сборка без использования flet build
      - name: Bootstrap Native Flutter Project
        run: |
          # Создаем пустой классический Flutter проект силами самого Google SDK
          flutter create --org org.ovik --project-name test_ov_app flutter_project
          cd flutter_project
          
          # Нативно подключаем официальный плагин serious_python прямо из реестра Flutter
          flutter pub add serious_python
          
          # Записываем правильный стартер в lib/main.dart по современному мобильному стандарту
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run();
          }
          EOF
          
          # Создаем внутреннюю структуру папок программы
          mkdir -p app
          cp ../main.py app/main.py
          cp ../screens.py app/
          cp ../data_manager.py app/
          cp ../config.py app/
          
          # Зашиваем ассеты (вопросы .dat и шрифты) напрямую внутрь контейнера
          mkdir -p app/assets
          cp -r ../assets/* app/assets/
          
          # Пакуем код в один бинарный архив силами flet pack (занимает 2 секунды)
          flet pack app/main.py
          
          # Приводим имя архива к стандарту serious_python
          if [ -f app.zip ]; then mv app.zip app-package.zip; fi
          if [ -f app-package.zip ]; then cp app-package.zip .; fi
          
          # Полностью перезаписываем pubspec.yaml эталонной разметкой Google Flutter
          cat << 'EOF' > pubspec.yaml
          name: test_ov_app
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            serious_python: ^4.7.0
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
            assets:
              - app-package.zip
          EOF
          
          # Отключаем десктопные демоны и изолируем сборку в один поток
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=false"
          
          # Запускаем прямую нативную компиляцию APK силами Google SDK
          flutter build apk --release

      # 8. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: flutter_project/build/app/outputs/flutter-apk/app-release.apk
