name: Native Flutter Build (No Flet-CLI Bugs)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта из репозитория
      - uses: actions/checkout@v4

      # 2. Устанавливаем стабильное окружение Java 17 для Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем зависимости. Сюда добавлен pyinstaller для успешной работы flet pack!
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas openpyxl cryptography reportlab flet pyinstaller

      # 6. НА ТИВНЫЙ МОНТАЖ ПРИЛОЖЕНИЯ: Собираем мобильный контейнер вручную в чистой папке
      - name: Bootstrap Native Flutter Project and Inject Python Code
        run: |
          # Создаем пустой классический Flutter проект силами самого Google SDK
          flutter create --org org.ovik --project-name test_ov_app flutter_project
          cd flutter_project
          
          # Подключаем официальный плагин serious_python и flet для запуска кода на Android
          flutter pub add serious_python flet
          
          # Создаем внутренний защищенный каталог для вашей программы
          mkdir -p app
          
          # Переносим туда ваши файлы из корня репозитория
          cp ../main.py app/main.py
          cp ../screens.py app/
          cp ../data_manager.py app/
          cp ../config.py app/
          
          # Зашиваем ассеты (вопросы .dat и шрифты) напрямую внутрь контейнера
          mkdir -p app/assets
          cp -r ../assets/* app/assets/
          
          # Используем официальный упаковщик flet pack — теперь pyinstaller установлен и команда сработает без ошибок
          flet pack app/main.py
          
          # Регистрируем полученный зашифрованный архив с кодом в манифесте Flutter (pubspec.yaml)
          sed -i '/assets:/a \    - app-package.zip' pubspec.yaml
          
          # Автоматически принимаем все системные лицензии Android Google
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Запускаем прямую нативную компиляцию APK
          flutter build apk --release

      # 7. Выгружаем готовый, защищенный мобильный комплекс в артефакты GitHub
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: flutter_project/build/app/outputs/flutter-apk/app-release.apk
