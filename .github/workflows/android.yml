name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++
          pip install --upgrade pip
          pip install buildozer cython

      - name: Fix Android AIDL Path for Buildozer
        run: |
          # Автоматически находим, куда установился SDK, и создаем системную ссылку на aidl
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
          sudo ln -s /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl || true
          # Резервный путь для глобальной видимости утилиты в Linux
          sudo apt-get install -y aidl

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: bin/*.apk
