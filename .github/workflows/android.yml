name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем зависимости и полноценные инструменты Android SDK для Linux
      - name: Install Buildozer and Linux Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl android-sdk
          python -m pip install --upgrade pip
          pip install buildozer

      # Одобряем все лицензии Google в системном SDK Linux
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | /usr/bin/sdkmanager --licenses || true

      # КРИТИЧЕСКИЙ ШАГ: Жестко прописываем в buildozer.spec пути к готовому системному SDK,
      # чтобы Buildozer не создавал свои папки и не стирал наши ссылки!
      - name: Inject System SDK Paths into Buildozer Spec
        run: |
          # Создаем структуру папок, которую требует внутренняя логика Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin/
          ln -s /usr/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          
          # Принудительно дописываем параметры путей в конец файла buildozer.spec
          echo -e "\nandroid.sdk_path = /usr/lib/android-sdk" >> buildozer.spec
          echo -e "android.ndk_path = " >> buildozer.spec
          echo "Системные пути успешно интегрированы в конфигурацию!"

      # Запускаем сборку — теперь Buildozer возьмет готовый системный sdkmanager по указанному пути
      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
