name: Flet Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flet Android Build Action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
