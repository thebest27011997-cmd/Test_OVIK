name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта из репозитория
      - uses: actions/checkout@v4

      # 2. Устанавливаем стабильное окружение Java 17 для Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12 на сервере
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем зависимости. Сюда добавлен нужный для сборки пакетов pyinstaller
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flet pandas openpyxl cryptography reportlab pyinstaller

      # 6. НА ТИВНЫЙ МОНТАЖ ПРИЛОЖЕНИЯ: Собираем мобильный контейнер в изолированной папке
      - name: Bootstrap Native Flutter Project and Inject Python Code
        run: |
          # Создаем пустой классический Flet-проект
          flet create tmp_app
          
          # Копируем ваши скрипты в корень созданного проекта
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          # Копируем ассеты (вопросы .dat и шрифты)
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          
          # Перезаписываем внутренний config.json для жесткой фиксации метаданных и зависимостей в APK
          cat << 'EOF' > tmp_app/config.json
          {
            "project_name": "Тест_ОВ",
            "org_domain": "org.ovik.testapp",
            "dependencies": [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
            ]
          }
          EOF
          
          # Переходим в папку проекта
          cd tmp_app
          
          # Отключаем десктопные платформы
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-macos-desktop
          
          # Запускаем официальную сборку. Она сама упакует файлы и нативно настроит pubspec.yaml без багов разметки
          flet build apk --yes --python-version 3.12

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: tmp_app/build/apk/*.apk
