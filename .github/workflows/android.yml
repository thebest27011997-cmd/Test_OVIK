name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта из репозитория
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем стабильный Python 3.11 на сервере
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Устанавливаем официальный сборочный инструмент Flet CLI
      - name: Install Flet CLI Bundler
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pyinstaller cryptography reportlab

      # 5. Принимаем лицензии Android Google
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. ЧИСТАЯ СБОРКА: Компилируем приложение напрямую из корня, жестко зафиксировав Python 3.11
      - name: Build Android APK Package
        run: |
          # Записываем требования строго в pyproject.toml в корне репозитория перед запуском,
          # чтобы сборщик вшил нативные мобильные Wheels криптографии под ARM64 процессоры
          cat << 'EOF' > pyproject.toml
          [project]
          name = "test-ovik-app"
          version = "1.0.0"
          dependencies = [
              "cryptography",
              "reportlab"
          ]
          EOF
          
          # Оптимизация памяти сервера и отключение десктопных модулей
          export FLET_BUILD_DESKTOP=0
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Xmx2048m"
          
          # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Принудительно передаем --python-version 3.11,
          # чтобы заблокировать скачивание экспериментального Python 3.14!
          flet build apk --yes --python-version 3.11
