name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI Bundler
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pyinstaller cryptography reportlab

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Сверхбыстрая сборка без тяжелых C-библиотек
      - name: Build Android APK Package
        run: |
          flet create tmp_app
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          cat << 'EOF' > tmp_app/pyproject.toml
          [project]
          name = "test-ovik-app"
          version = "1.0.0"
          dependencies = [
              "flet==1.0.0",
              "cryptography",
              "reportlab"
          ]
          EOF
          cp tmp_app/pyproject.toml tmp_app/src/pyproject.toml
          
          cd tmp_app
          export FLET_BUILD_DESKTOP=0
          flet build apk --yes

      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: tmp_app/build/apk/*.apk
