name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java (критически важно для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. ОФИЦИАЛЬНОЕ ДЕЙСТВИЕ GOOGLE: Автоматически разворачивает Android SDK и принимает все лицензии!
      - name: Setup Android SDK and Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          log-accepted-licenses: true

      # 4. Настраиваем Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Устанавливаем зависимости (используем стабильный релиз Flet 1.0.0)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pandas openpyxl pycryptodome reportlab

      # 6. Запускаем нативную сборку Flet — теперь она увидит идеальный, лицензированный SDK от Google
      - name: Build Android APK
        run: |
          flet build apk --yes

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: build/apk/*.apk
