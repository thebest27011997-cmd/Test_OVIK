name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl
          pip install --upgrade pip
          pip install buildozer cython

      # СТРАТЕГИЧЕСКИЙ ШАГ: Скачиваем оригинальные sdk-tools и кладем их точно по адресу для Buildozer
      - name: Pre-install Legacy Android SDK Tools
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/
          wget -q https://google.com
          unzip -q sdk-tools-linux-4333796.zip -d ~/.buildozer/android/platform/android-sdk/
          rm sdk-tools-linux-4333796.zip

      # Принимаем лицензии через только что установленный sdkmanager
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
