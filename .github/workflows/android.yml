name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта из репозитория
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем стабильный Python 3.11 на сервере (Идеальная версия под мобильный pandas)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Устанавливаем официальный сборочный инструмент Flet CLI
      - name: Install Flet CLI Bundler
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pyinstaller

      # 5. Принимаем лицензии Android Google
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. СБОРКА: Компилируем приложение с правильной загрузкой мобильных бинарников
      - name: Build Android APK Package
        run: |
          # Создаем чистый эталонный проект Flet
          flet create tmp_app
          
          # Копируем ваши скрипты в корень и в папку src созданного проекта
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          # Копируем зашифрованные базы вопросов .dat и шрифты
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          # ЖЕСТКАЯ МОБИЛЬНАЯ ФИКСАЦИЯ: Записываем требования строго в pyproject.toml папки сборки.
          # Сборщик Flet увидит этот файл, обратится к репозиторию мобильных пакетов (Kivy/Python-for-Android) 
          # и скачает скомпилированные под смартфоны ARM64 версии pandas, numpy и cryptography!
          cat << 'EOF' > tmp_app/pyproject.toml
          [project]
          name = "test-ovik-app"
          version = "1.0.0"
          dependencies = [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
          ]
          EOF
          cp tmp_app/pyproject.toml tmp_app/src/pyproject.toml
          
          # Переходим в подготовленный каталог
          cd tmp_app
          
          # ОПТИМИЗАЦИЯ ПАМЯТИ: Полностью вырезаем из компилятора тяжелые десктопные модули,
          # чтобы разгрузить ОЗУ сервера и предотвратить зависания и вылеты Gradle по лимиту времени
          export FLET_BUILD_DESKTOP=0
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Xmx2048m"
          
          # Запускаем официальную сборку (Flet сам нативно упакует мобильные библиотеки)
          flet build apk --yes

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: tmp_app/build/apk/*.apk
