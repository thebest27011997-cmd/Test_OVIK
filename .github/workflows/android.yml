name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем все зависимости, включая официальные инструменты Android SDK для Ubuntu (sdkmanager)
      - name: Install Buildozer and Linux Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl android-sdk
          pip install --upgrade pip
          pip install buildozer cython

      # ЖЕСТКОЕ ИСПРАВЛЕНИЕ ПУТЕЙ: Создаем для Buildozer структуру папок, которую он требует,
      # и связываем её с системным, рабочим sdkmanager из Linux Ubuntu
      - name: Force Link System SDK to Buildozer Path
        run: |
          # Создаем физический путь, куда заглядывает компилятор
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin/
          
          # Делаем прямую ссылку на рабочий системный sdkmanager
          ln -s /usr/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          
          # Одобряем все лицензии Google в системном SDK
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | /usr/bin/sdkmanager --licenses || true
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
