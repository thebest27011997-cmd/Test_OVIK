name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта (main.py, screens.py, assets и т.д.)
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем стабильный Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Устанавливаем официальный автономный сборщик Flet CLI глобально
      - name: Install Flet CLI Bundler
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flet==1.0.0

      # 5. КРИТИЧЕСКИЙ ШАГ: Принимаем встроенные на сервере лицензии Android (занимает 1 секунду)
      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. СВЕРХБЫСТРАЯ СБОРКА: Компилируем ваш проект напрямую из корня репозитория.
      # Мы жестко передаем зависимости через флаг --packages, исключая чтение сбойных pyproject/requirements!
      - name: Build Android APK Package
        run: |
          flet build apk --yes --python-version 3.12 --packages pandas openpyxl cryptography reportlab

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: build/apk/*.apk
