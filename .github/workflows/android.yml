name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (требуется для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Устанавливаем зависимости из вашего pyproject.toml
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pandas openpyxl pycryptodome reportlab

      # 5. Принимаем лицензии и докачиваем платформы Android 34 и инструменты сборки
      - name: Install Missing Android SDK Components & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. КРИТИЧЕСКИЙ ШАГ: Отключаем сборку под Linux Desktop во Flutter, чтобы Doctor не требовал GTK-библиотеки
      - name: Disable Linux Desktop Support in Flutter
        run: |
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-macos-desktop

      # 7. Запускаем целевую сборку строго под Android APK
      - name: Build Android APK
        run: |
          flet build apk --yes

      # 8. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: build/apk/*.apk
