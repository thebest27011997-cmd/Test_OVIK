name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Библиотеки Linux нужны только для прохождения теста Flutter Doctor
      - name: Install Linux GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 pandas openpyxl cryptography reportlab

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Bootstrap and Build Native Android Package
        run: |
          flet create tmp_app
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          cp config.json tmp_app/src/ || true
          cp requirements.txt tmp_app/src/requirements.txt
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          cd tmp_app
          flutter config --no-enable-linux-desktop
          flet build apk --yes --python-version 3.12

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: tmp_app/build/apk/*.apk
