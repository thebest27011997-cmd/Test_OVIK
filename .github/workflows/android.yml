name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем исходный код вашего проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Разворачиваем чистый официальный Flutter SDK от Google
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем стабильный Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем зависимости на сервер сборки
      - name: Install Python & Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build
          python3 -m pip install --upgrade pip
          python3 -m pip install flet pandas openpyxl cryptography reportlab pyinstaller serious_python

      # 6. Принимаем лицензии Android
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 7. ШАГ ОПТИМИЗАЦИИ ВРЕМЕНИ: Собираем Python-окружение ЗАРАНЕЕ силами python-скрипта (занимает 30 секунд вместо 10 минут)
      - name: Pre-compile Python Environment
        run: |
          # Создаем чистый проект Flet
          flet create tmp_app
          
          # Переносим ваш код в КОРЕНЬ и в папку SRC
          cp main.py tmp_app/main.py
          cp screens.py tmp_app/
          cp data_manager.py tmp_app/
          cp config.py tmp_app/
          
          cp main.py tmp_app/src/main.py
          cp screens.py tmp_app/src/
          cp data_manager.py tmp_app/src/
          cp config.py tmp_app/src/
          
          # Копируем ассеты
          mkdir -p tmp_app/assets
          cp -r assets/* tmp_app/assets/
          mkdir -p tmp_app/src/assets
          cp -r assets/* tmp_app/src/assets/
          
          # Прописываем зависимости
          cat << 'EOF' > tmp_app/requirements.txt
          pandas
          openpyxl
          cryptography
          reportlab
          EOF
          cp tmp_app/requirements.txt tmp_app/src/requirements.txt
          
          # Перезаписываем внутренний config.json
          cat << 'EOF' > tmp_app/config.json
          {
            "project_name": "Тест_ОВ",
            "org_domain": "org.ovik.testapp",
            "dependencies": [
              "pandas",
              "openpyxl",
              "cryptography",
              "reportlab"
            ]
          }
          EOF
          cp tmp_app/config.json tmp_app/src/config.json
          
          # Нативно собираем zip-контейнер Python. Это разгрузит Gradle!
          cd tmp_app
          python3 -m serious_python package src/main.py

      # 8. СВЕРХБЫСТРЫЙ ФИНАЛ: Запускаем Gradle в стандартном параллельном режиме (сборка займет 2-3 минуты)
      - name: Build Android APK Package
        run: |
          cd tmp_app
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-macos-desktop
          
          # Запускаем финальную упаковку собранного контейнера
          flet build apk --yes

      # 9. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-Native-App
          path: tmp_app/build/apk/*.apk
