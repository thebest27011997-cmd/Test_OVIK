name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код проекта
      - uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (необходима для компиляции Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Устанавливаем системные зависимости Linux и компиляторы для C-модулей pycryptodome
      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake gcc g++ aidl android-sdk
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0

      # 5. Принудительно одобряем все лицензии во избежание интерактивных вопросов
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | /usr/bin/sdkmanager --licenses || true

      # 6. КРИТИЧЕСКИЙ ШАГ: Конфигурируем и запускаем сборку — Buildozer сам скачает NDK под pycryptodome
      - name: Build with Buildozer
        run: |
          # Внедряем настройки стабильного SDK в buildozer.spec перед стартом
          echo -e "\nandroid.sdk_path = /usr/lib/android-sdk" >> buildozer.spec
          echo -e "android.ndk_path = " >> buildozer.spec
          
          # Запуск компиляции
          buildozer android debug

      # 7. Выгружаем готовый рабочий .apk в артефакты репозитория
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-OB-App
          path: bin/*.apk
